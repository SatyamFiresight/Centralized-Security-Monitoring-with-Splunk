# inputs.conf
# Defines what logs Splunk Universal Forwarder on the VM should collect and forward.

[default]
host = win10-vm   ; identifies the VM in Splunk searches

# --- Windows Security Event Logs (for brute-force, login attempts) ---
[WinEventLog://Security]
disabled = 0
index = security

# --- Windows Application Logs (custom alerts from scripts) ---
[WinEventLog://Application]
disabled = 0
index = security

# --- Custom Logs generated by simulation scripts ---
[monitor://C:\Logs\]
disabled = 0
index = security
sourcetype = sim:customlogs

# --- Exfiltration Logs (data theft simulation) ---
[monitor://C:\exfil\]
disabled = 0
index = security
sourcetype = sim:exfil

